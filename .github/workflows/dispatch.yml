name: Trigger CF Pages Deploy

on:
  push:
    branches:
      - main

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deployment
        run: |
          RESPONSE=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/pages/projects/nwtfhub/deployments" \
            -d '{"branch":"main"}')
          echo "HTTP Status: $RESPONSE"
          cat response.json
          if [ "$RESPONSE" -ne 200 ]; then
            echo "Failed to trigger Cloudflare Pages deployment"
            exit 1
          fi
